# The site + its Postgres as a self-contained stack, fronted by your existing
# Caddy (which reverse-proxies to 127.0.0.1:3010). Replaces the PM2 + host-pg
# setup. The app image is distroless.
#
# Data migration: this defines a FRESH `db` volume. To carry over the current
# data, restore a dump into it once:
#   docker compose up -d db
#   docker compose exec -T db pg_restore -U fu_app -d furkanunsalan --clean --if-exists < latest.dump
# then run migrations from the app (or `npm run db:migrate` against the exposed port).
#
# Secrets come from a sibling `.env` file (see .env.example). Never commit it.

services:
  app:
    build: .
    image: furkanunsalan-web
    restart: unless-stopped
    # Secrets come from the sibling .env. Compose DOES interpolate env_file
    # values, so any literal `$` in a value — notably the argon2 hash
    # (`$argon2id$v=19$...`) — must be written `$$` in .env; compose un-doubles
    # it back to a single `$` inside the container. A bare `$argon2id` is read as
    # unset variables and blanked out, yielding a mangled hash (login always fails).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # PG_PASSWORD is alphanumeric, so this interpolation is $-safe.
      DATABASE_URL: postgres://fu_app:${PG_PASSWORD}@db:5432/furkanunsalan
      UPLOADS_DIR: /uploads
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://furkanunsalan.dev}
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Caddy on the host proxies to this. Bound to localhost only.
      - "127.0.0.1:3010:3000"
    # NOTE: distroless has no shell, so no `healthcheck:` here — point your
    # Uptime-Kuma at http://127.0.0.1:3010/api/health instead.

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fu_app
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: furkanunsalan
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on localhost only. The app + terminal reach Postgres over the
    # compose network (db:5432); this host binding is for `npm run db:migrate` /
    # pg_restore during deploys and for the preview stack (host-gateway). Mirrors
    # the old host-pg exposure so nothing host-side changes.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fu_app -d furkanunsalan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SSH terminal twin (ssh -p 2222 furkanunsalan.dev). Same content over the
  # compose network from the same db, so it stays in sync with the site.
  terminal:
    build:
      context: ./terminal
    image: furkanunsalan-term
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "2222"
      HOST_KEY: /hostkey/term_ed25519
      DATABASE_URL: postgres://fu_app:${PG_PASSWORD}@db:5432/furkanunsalan
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: furkanunsalan
      RAINDROP_TOKEN: ${RAINDROP_TOKEN:-}
    volumes:
      - termkey:/hostkey
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Public SSH — this is the terminal visitors connect to.
      - "2222:2222"

volumes:
  uploads:
  pgdata:
  termkey:
